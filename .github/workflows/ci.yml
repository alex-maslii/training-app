name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Expo SDK version check
        run: npx expo install --check
        working-directory: apps/mobile

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      # Local Postgres in Docker with all migrations applied. No secrets needed.
      - run: supabase db start
      - name: RLS tests (pgTAP)
        run: supabase test db
      - name: Lint database functions
        run: supabase db lint --level warning --fail-on error

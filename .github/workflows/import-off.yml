name: Import Open Food Facts (Poland)

# Weekly refresh of supermarket products from the Open Food Facts export.
# Needs repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF.
on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      # No secrets in the environment while dependency install scripts run.
      - run: npm ci
      - run: npm run import:off -- --apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
